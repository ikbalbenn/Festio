<style>
:root{--bg:#FBF4E4;--card:#FFFCF4;--ink:#2B1A06;--mut:#7A6849;--line:#EBDDB8;--dk:#5C3A10;--navy:#C98A1B;--gold:#98600A;--goldl:#F8E7B9;--red:#B3261E;--grn:#1B7F52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15100A;--card:#221A10;--ink:#F8ECD0;--mut:#BEA97F;--line:#3C2F1A;--dk:#9A7236;--navy:#C98A1B;--gold:#E8B652;--goldl:#41330F;--red:#FF8A7A;--grn:#5FD39B}}
:root[data-theme="dark"]{--bg:#15100A;--card:#221A10;--ink:#F8ECD0;--mut:#BEA97F;--line:#3C2F1A;--dk:#9A7236;--navy:#C98A1B;--gold:#E8B652;--goldl:#41330F;--red:#FF8A7A;--grn:#5FD39B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{background:linear-gradient(135deg,#F3C766,#C98A1B);color:#2B1A06;box-shadow:0 2px 10px rgba(120,70,0,.28);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 0 0 2px rgba(255,248,225,.75)}
.top h1{margin:0;font:800 22px Fraunces,serif}.top small{display:block;color:rgba(43,26,6,.75);font-size:12px}
.gear{background:none;border:0;color:#2B1A06;font-size:22px;cursor:pointer;padding:6px}
.back{background:none;border:0;color:var(--gold);font:700 15px Figtree;padding:6px 0;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:16px}
h2{font:800 20px Fraunces,serif;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#F6CF75,#C98A1B);color:#2B1A06;box-shadow:0 4px 14px rgba(120,70,0,.25);border-radius:18px;padding:20px;margin-bottom:12px}
.hero .big{font:800 40px Fraunces,serif;color:#2B1A06;line-height:1.1}.hero span{color:rgba(43,26,6,.8);font-size:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kp b{display:block;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}.pos{color:var(--grn)}.neg{color:var(--red)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--goldl);color:var(--gold);white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line);display:flex;overflow:hidden;margin-top:8px}.bar i{display:block}
.item{cursor:pointer}
.btn{background:linear-gradient(135deg,#F6CF75,#D49A2A);color:#2B1A06;border:0;border-radius:12px;padding:12px 16px;font:700 16px Figtree;cursor:pointer;width:100%}
.btn.s{width:auto;padding:7px 12px;font-size:14px}.btn.g{background:var(--line);color:var(--ink)}.btn.d{background:none;color:var(--red);border:1px solid var(--red);margin-top:10px}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:0 4px}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}.line:last-child{border:0}.tot{font-weight:800}
.acts{display:flex;gap:8px;margin-top:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 10.5px Figtree;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button span{font-size:20px}nav button.on{color:var(--gold)}
#m{position:fixed;inset:0;background:rgba(5,9,20,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.open{display:flex}.sheet{background:var(--card);width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:16px Figtree;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{text-align:center;color:var(--mut);padding:20px}
.mrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow input{padding:9px}.mh{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;font-size:12px;color:var(--mut);font-weight:600}
.ban{background:var(--goldl);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:12px}
.ban .acts{margin-top:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--mut);background:var(--card)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.tr td{font-weight:800;background:var(--goldl)}tbody tr{cursor:pointer}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn svg{width:130px;height:130px;flex:none}.lg div{display:flex;gap:8px;align-items:center;font-size:14px;margin:3px 0}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}

:root{--redl:#FDE7E4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--redl:#4A1D19}}
:root[data-theme="dark"]{--redl:#4A1D19}
.chip.st-d{background:#FFF0A8;color:#7A6200}.chip.st-c{background:#FFD9A6;color:#A34800}.chip.st-t{background:#C8EDD5;color:#17663C}.chip.st-a{background:#F9CFCB;color:#A8231A}

:root[data-theme="dark"] .chip.st-d{background:#4A3F0A;color:#FFE066}:root[data-theme="dark"] .chip.st-c{background:#5A3410;color:#FFB366}:root[data-theme="dark"] .chip.st-t{background:#123F2B;color:#6FE3A5}:root[data-theme="dark"] .chip.st-a{background:#5A1D18;color:#FF9A8F}
.bd-d{border-left:5px solid #E5B800}.bd-c{border-left:5px solid #F08A24}.bd-t{border-left:5px solid #2FA37A}.bd-a{border-left:5px solid #D9473A}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.sd.st-d{background:#E5B800}.sd.st-c{background:#F08A24}.sd.st-t{background:#2FA37A}.sd.st-a{background:#D9473A}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin:12px 0}.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:700 14px Figtree;color:var(--mut);cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ban.al{background:var(--redl);border-color:var(--red)}.ban.al div{margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#B3261E;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;display:none;font-weight:600}#toast.show{display:block}
nav button span{position:relative}.dot{position:absolute;top:-2px;right:-6px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
th.l,td.l{text-align:left}td a{color:var(--gold)}
.mini{font-size:13px;color:var(--mut);margin:6px 0}
.rt{display:flex;align-items:center;gap:10px}.wab{background:#25D366;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex:none;line-height:1}
.arow{display:grid;grid-template-columns:1fr 108px 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.arow input,.arow select{padding:9px;font-size:15px}.mh.a{grid-template-columns:1fr 108px 84px}
.mrow.q,.mh.q{grid-template-columns:1fr 96px}

function hist(){const L=S.mar.map(m=>({m,c:calc(m)})),K={d:(a,b)=>a.m.d<b.m.d?1:-1,b:(a,b)=>b.c.b-a.c.b,g:(a,b)=>b.c.mg-a.c.mg,n:(a,b)=>b.m.n-a.m.n};L.sort(K[sortK]);
const LA=L.filter(x=>x.m.s!='Annulé'),T=f=>sum(LA,x=>f(x.c)),R=T(c=>c.rev),D=T(c=>c.dep),B=R-D,top=[...LA].sort(K.b).slice(0,3);
const parts=[['Nourriture et boissons',T(c=>c.nr),'#E0A93B'],['Personnel',T(c=>c.per),'#8B5A2B'],['Matériel',T(c=>c.mat),'#2FA37A'],['Transport',T(c=>c.tr),'#E07A5F'],['Autres',T(c=>c.au),'#8A94A8']],tot=sum(parts,p=>p[1]),CI=2*Math.PI*40;let off=0;
const arcs=tot?parts.map(p=>{const l=p[1]/tot*CI,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${p[2]}" stroke-width="18" stroke-dasharray="${l} ${CI-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join(''):'';
return `<div class="row"><h2 style="margin-top:0">Comparer les mariages</h2></div><select aria-label="Trier" onchange="sortK=this.value;render()">${[['d','Trier par date'],['b','Trier par bénéfice'],['g','Trier par marge'],['n','Trier par invités']].map(o=>`<option value="${o[0]}"${o[0]==sortK?' selected':''}>${o[1]}</option>`).join('')}</select>
<div class="tw" style="margin-top:10px"><table><thead><tr><th>Client</th><th>Date</th><th>Inv.</th><th>Revenus</th><th>Nourr.</th><th>Perso</th><th>Prêt mat.</th><th>Transp.</th><th>Autres</th><th>Dépenses</th><th>Bénéfice</th><th>Marge</th><th>€/inv.</th></tr></thead><tbody>`+
L.map(({m,c})=>`<tr onclick="go('det','${m.id}')"${m.s=='Annulé'?' style="opacity:.5"':''}><td><i class="sd st-${sk(m.s)}"></i>${esc(m.c)}</td><td>${fd(m.d)}</td><td>${m.n}</td><td>${fm(c.rev)}</td><td>${fm(c.nr)}</td><td>${fm(c.per)}</td><td>${fm(c.mat)}</td><td>${fm(c.tr)}</td><td>${fm(c.au)}</td><td>${fm(c.dep)}</td><td class="${cls(c.b)}">${fm(c.b)}</td><td>${pc(c.mg)}</td><td>${m.n?fm(c.b/m.n):'–'}</td></tr>`).join('')+
`<tr class="tr"><td>TOTAL</td><td></td><td>${sum(LA,x=>x.m.n)}</td><td>${fm(R)}</td><td>${fm(T(c=>c.nr))}</td><td>${fm(T(c=>c.per))}</td><td>${fm(T(c=>c.mat))}</td><td>${fm(T(c=>c.tr))}</td><td>${fm(T(c=>c.au))}</td><td>${fm(D)}</td><td>${fm(B)}</td><td>${R?pc(B/R):'–'}</td><td></td></tr></tbody></table></div>
${L.length>LA.length?'<p class="mini">Les mariages annulés (grisés) ne sont pas comptés dans le total.</p>':''}<h2>Top 3 des plus rentables</h2><div class="card">${top.length?top.map((x,i)=>`<div class="line"><span>${i+1}. ${esc(x.m.c)}</span><b class="${cls(x.c.b)}">${fm(x.c.b)} · ${pc(x.c.mg)}</b></div>`).join(''):'<span class="mut">Aucun mariage.</span>'}</div>
<h2>Où part l'argent</h2><div class="card dn">${tot?`<svg viewBox="0 0 100 100" role="img" aria-label="Répartition des dépenses">${arcs}</svg><div class="lg">${parts.map(p=>`<div><i style="background:${p[2]}"></i>${p[0]} · ${fm(p[1])} (${pc(p[1]/tot)})</div>`).join('')}</div>`:'<span class="mut">Pas encore de dépenses.</span>'}</div>`}
function render(){const V={home,mar,det,ach,eq,cat,hist}[view];$('#app').innerHTML=V();const t=view=='det'?'mar':view;$('#nav').innerHTML=tabs.map(a=>`<button class="${a[0]==t?'on':''}" onclick="go('${a[0]}')"><span>${a[1]}${a[0]=='cat'&&shortages().length?'<i class="dot"></i>':''}</span>${a[2]}</button>`).join('')}
/* ---- données : sauvegarde, Excel ---- */
const loadX=()=>window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko(new Error('connexion internet nécessaire pour créer un fichier Excel'));document.head.appendChild(s)});
function pick(){closeF();$('#file').click()}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
try{const d=migrate(JSON.parse(await f.text()));if(!d.mar.length&&!d.ach.length&&!d.emp.length)throw new Error('fichier vide ou non reconnu');
if(confirm(`Restaurer cette sauvegarde ?\n\n${d.mar.length} mariages · ${d.ach.length} achats · ${d.emp.length} employés\n\nCela REMPLACE les données actuelles (une copie est gardée).`)){try{localStorage.setItem('festio_prev',JSON.stringify(S))}catch(x){}S=d;save();prevK=new Set(shortages().map(x=>x.k));go('home')}}
catch(x){alert('Restauration impossible : '+x.message)}};
function saveFile(name,blob){if(/Android|iPhone|iPad/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[new File([blob],name)]})){navigator.share({files:[new File([blob],name)],title:name}).catch(()=>{});return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const stamp=()=>today();
function exportJSON(){saveFile(`festio-sauvegarde-${stamp()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}))}
async function exportXLSX(){try{await loadX()}catch(x){return alert('Export Excel impossible : '+x.message)}
const dt=s=>{if(!s)return'';const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])},wb=XLSX.utils.book_new(),
add=(n,h,rows,dc)=>{const ws=XLSX.utils.aoa_to_sheet([h,...rows],{cellDates:true});(dc||[]).forEach(c=>{for(let r=1;r<=rows.length;r++){const x=ws[XLSX.utils.encode_cell({r,c})];if(x&&x.t=='d')x.z='dd/mm/yyyy'}});ws['!cols']=h.map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,ws,n)};
add('Historique',['ID','Client','Date','Statut','Invités','Revenus (€)','Nourriture et boissons (€)','Personnel (€)','Matériel prêté/loué (€)','Transport (€)','Autres (€)','Total dépenses (€)','Bénéfice (€)','Marge','Bénéfice / invité (€)'],S.mar.map(m=>{const c=calc(m);return[m.id,m.c,dt(m.d),m.s,m.n,c.rev,c.nr,c.per,c.mat,c.tr,c.au,c.dep,c.b,c.mg,m.n?c.b/m.n:0]}),[2]);
add('Mariages',['ID','Client','Téléphone','Date','Invités','Lieu / Adresse','Formule','Prix par personne (€)','Prix total (€)','Transport (€)','Autres frais (€)','Matériel prêté/loué (€)','Heure RDV','Statut'],S.mar.map(m=>[m.id,m.c,m.t,dt(m.d),m.n,m.l,m.f,m.p,m.n*m.p,m.tr,m.au,m.pr||0,m.hd||'',m.s]),[3]);
add('Achats',['Date','ID mariage','Client','Fournisseur','Produit','Catégorie','Montant (€)'],S.ach.map(a=>[dt(a.d),a.m,mc(a.m),a.f,a.p,a.c,a.mt]),[0]);
add('Employés',['Nom','Poste','Tarif horaire (€)','Téléphone','Adresse'],S.emp.map(e=>[e.n,e.r,e.t,e.tel,e.adr]));
add('Heures personnel',['ID mariage','Client','Employé','Heures','Tarif (€/h)','Coût (€)'],S.heu.map(h=>[h.m,mc(h.m),h.e,h.h,h.t,h.h*h.t]));
add('Stock matériel',['Équipement','Stock','Réservé par invité'],S.cat.map(c=>[c.n,c.st==null?'':c.st,c.pp==null?'':c.pp]));
add('Matériel utilisé',['ID mariage','Client','Équipement','Quantité'],S.use.map(u=>[u.m,mc(u.m),u.e,u.q]));
add('Menu',['Produit','Unité','Prix par unité (€)','Quantité par personne'],S.prod.map(p=>[p.n,p.u,p.p,p.q]));
saveFile(`festio-donnees-${stamp()}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
function wipe(){if(confirm('Effacer toutes les données et repartir de zéro ?')){try{localStorage.setItem('festio_prev',JSON.stringify(S))}catch(x){}S={v:4,demo:0,win:1,mar:[],prod:[],ach:[],emp:[],heu:[],cat:[],use:[]};NEWMAT.forEach(n=>S.cat.push({n,st:null,pp:ppOf(n)}));closeF();save();prevK=new Set();go('home')}}
function restore(){let p=null;try{p=JSON.parse(localStorage.getItem('festio_prev')||'null')}catch(x){}if(!p)return alert('Aucune copie précédente.');if(confirm("Revenir aux données d'avant la dernière restauration / remise à zéro ?")){S=migrate(p);closeF();save();prevK=new Set(shortages().map(x=>x.k));go('home')}}
function settings(){loadX().catch(()=>{});const m=$('#m');m.innerHTML=`<div class="sheet"><h2 style="margin-top:0">Données et sauvegarde</h2><p class="mut">Les données sont enregistrées sur cet appareil seulement. Fais une sauvegarde de temps en temps.</p>
<button class="btn" onclick="exportJSON()">💾 Sauvegarde complète (.json)</button><button class="btn g" style="margin-top:8px" onclick="pick()">📥 Restaurer une sauvegarde (.json)</button><button class="btn g" style="margin-top:8px" onclick="exportXLSX()">📤 Exporter vers Excel</button><button class="btn g" style="margin-top:8px" onclick="restore()">↩️ Revenir en arrière</button><button class="btn d" onclick="wipe()">Effacer et repartir de zéro</button><div class="acts"><button class="btn g" onclick="closeF()">Fermer</button></div></div>`;m.classList.add('open')}
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
